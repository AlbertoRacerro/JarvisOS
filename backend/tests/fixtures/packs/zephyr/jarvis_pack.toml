# Fake project pack for the test suite: carries one project term so the egress guard has something to match.
id = "zephyr"

[sensitivity]
terms = ["zephyr"]

[readiness]
cases = "readiness_cases.toml"

[search_guard]
min_groups = 4
groups = [
    ["apple", "malus"],
    ["banana", "musa"],
    ["cherry", "prunus"],
    ["date", "phoenix"],
    ["elderberry", "sambucus"],
]
