# Fake project pack for the test suite: carries one project term so the egress guard has something to match.
id = "zephyr"

[sensitivity]
terms = ["zephyr"]

[readiness]
cases = "readiness_cases.toml"

[search_guard]
min_groups = 4
allow_generic_ranges = true
groups = [
    ["apple", "malus"],
    ["banana", "musa"],
    ["cherry", "prunus"],
    ["date", "phoenix"],
    ["elderberry", "sambucus"],
]
exact_combinations = [
    ["apple", "banana", "cherry", "date"],
    ["alpha", "beta", "gamma"],
]

[[search_guard.protected_dimensions]]
value = 50.0
unit = "mm"
tolerance_rel = 0.02
